<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - Flipkart Clone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
    }

    .navbar {
      background-color: #2874f0;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    .navbar .logo {
      font-weight: bold;
      font-size: 24px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin: 20px 0;
    }

    .checkout-container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 5px;
    }

    .address-section,
    .payment-section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 20px;
      color: #2874f0;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .place-order-btn {
      background-color: green;
      color: white;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    .images-row {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      justify-content: center;
      flex-wrap: wrap;
    }

    .images-row img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    footer {
      background-color: #172337;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    footer a {
      color: lightblue;
      margin: 0 10px;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .images-row {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo"><a href="index.html">Flipkart</a></div>
    <div>
        <a href="{{ url_for('login') }}">Login</a>
<a href="{{ url_for('home') }}">Home</a>
<a href="{{ url_for('about') }}">About</a>
<a href="{{ url_for('cart') }}">Cart</a>
<a href="{{ url_for('checkout') }}">Checkout</a>
<a href="{{ url_for('client') }}">Client</a>
<a href="{{ url_for('contact') }}">Contact</a>
<a href="{{ url_for('order_confirmation') }}">Order-confirmation</a>
<a href="{{ url_for('payment') }}">Payment</a>
<a href="{{ url_for('product_detail') }}">Product-detail</a>
<a href="{{ url_for('product') }}">Product</a>
<a href="{{ url_for('search_results') }}">Search-results</a>
<a href="{{ url_for('profile') }}">Profile</a>
<a href="{{ url_for('services') }}">Services</a>
<a href="{{ url_for('signup') }}">Signup</a>
<a href="{{ url_for('view') }}">View</a>

    </div>
  </div>

  <h1>Checkout</h1>

  <!-- Checkout Content -->
  <div class="checkout-container">
    
    <!-- Address Section -->
    <div class="address-section">
      <div class="section-title">Shipping Address</div>
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="text" id="phone" placeholder="Phone Number" required />
      <input type="text" id="address1" placeholder="Address Line 1" required />
      <input type="text" id="address2" placeholder="Address Line 2" />
      <input type="text" id="city" placeholder="City" required />
      <input type="text" id="state" placeholder="State" required />
      <input type="text" id="pin" placeholder="PIN Code" required />
    </div>

    <!-- Payment Section -->
    <div class="payment-section">
      <div class="section-title">Payment Method</div>
      <select id="payment-method" onchange="togglePaymentInput()">
        <option value="cod">Cash on Delivery</option>
        <option value="upi">UPI</option>
        <option value="card">Credit/Debit Card</option>
        <option value="netbanking">Net Banking</option>
      </select>
      <input type="text" id="payment-details" placeholder="Enter UPI/Card Details if applicable" style="display: none;" />
    </div>

    <!-- Product Images Preview -->
    <div class="images-row">
      <img src="{{ url_for('static', filename='images/smartphone.png') }}" alt="Phone">
<img src="{{ url_for('static', filename='images/shoes.png') }}" alt="Shoes">
<img src="{{ url_for('static', filename='images/smart-watch.png') }}" alt="Watch">
<img src="{{ url_for('static', filename='images/electronic.png') }}" alt="Bag">

    </div>

    <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Flipkart Clone. All rights reserved.</p>
    <p>
      <a href="#">Terms</a> | 
      <a href="#">Privacy</a> | 
      <a href="#">Support</a>
    </p>
  </footer>

  <!-- JavaScript -->
  <script>
    function togglePaymentInput() {
      const method = document.getElementById("payment-method").value;
      const detailsInput = document.getElementById("payment-details");
      if (method === "cod") {
        detailsInput.style.display = "none";
        detailsInput.value = "";
      } else {
        detailsInput.style.display = "block";
      }
    }

    function placeOrder() {
      // Basic Validation
      const requiredFields = ["name", "phone", "address1", "city", "state", "pin"];
      for (let id of requiredFields) {
        const field = document.getElementById(id);
        if (!field.value.trim()) {
          alert("Please fill out all required fields.");
          field.focus();
          return;
        }
      }

      const paymentMethod = document.getElementById("payment-method").value;
      const paymentDetails = document.getElementById("payment-details").value;

      if (paymentMethod !== "cod" && paymentDetails.trim() === "") {
        alert("Please enter your payment details.");
        document.getElementById("payment-details").focus();
        return;
      }

      alert("Thank you! Your order has been placed successfully.");
      window.location.href = "order_confirmation.html";
    }
  </script>

</body>
</html>
